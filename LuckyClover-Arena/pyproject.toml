[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-luckyclover-arena"
version = "0.3.6"
description = "Double-elimination arena controller for LuckyClover PvP events."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mell" }
]
dependencies = [
    "endstone>=0.11"
]

[project.entry-points."endstone"]
luckyclover-arena = "endstone_luckyclover_arena:LuckyCloverArena"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_luckyclover_arena"]

[tool.hatch.build.targets.wheel.force-include]
"src/endstone_luckyclover_arena/config.toml" = "endstone_luckyclover_arena/config.toml"
